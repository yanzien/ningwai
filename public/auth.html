<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 / 注册 · 宁外八一</title>
<meta name="theme-color" content="#1e3a5f">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-brand"><img class="brand-logo" src="/logo-64.png" alt="宁外八一" style="width:26px;height:26px">宁外八一</div>
  <div class="auth-sub">宁波外国语学校 · 浙江省八一学校 校园社区</div>

  <div class="auth-tabs" id="auth-tabs">
    <button data-tab="login" class="active">登录</button>
    <button data-tab="register">注册</button>
  </div>

  <form id="login-form">
    <label class="field"><span>用户名</span><input class="input" name="username" autocomplete="username" required></label>
    <label class="field"><span>密码</span>
      <div class="pw-wrap"><input class="input" name="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle" data-target="password">显示</button></div>
    </label>
    <button class="btn" type="submit">登 录</button>
    <div class="auth-hint">首次使用请先注册；如忘记密码请联系组织管理员</div>
  </form>

  <form id="register-form" hidden>
    <label class="field"><span>用户名（3-24 位字母/数字/下划线）</span><input class="input" name="username" autocomplete="username" required></label>
    <label class="field"><span>密码（至少 8 位）</span>
      <div class="pw-wrap"><input class="input" name="password" type="password" autocomplete="new-password" required><button type="button" class="pw-toggle" data-target="password">显示</button></div>
    </label>
    <label class="field"><span>确认密码</span><input class="input" name="confirm" type="password" autocomplete="new-password" required></label>
    <label class="field"><span>加入组织</span>
      <select class="input" name="org_slug" id="reg-org"></select>
    </label>
    <div id="reg-org-fields" hidden>
      <label class="field"><span>班级</span>
        <div class="row">
          <select class="input" id="reg-grade" style="flex:1"></select>
          <select class="input" id="reg-class" style="flex:1"></select>
        </div>
      </label>
      <label class="field"><span>姓名</span><input class="input" name="real_name" maxlength="30" placeholder="张三"></label>
      <label class="field"><span>学号</span><input class="input" name="student_no" maxlength="2" placeholder="01"></label>
    </div>
    <div class="field">
      <span>阅读说明</span>
      <div class="row" style="gap:10px;align-items:center">
        <button type="button" class="btn btn-outline" id="reg-read">📄 阅读《加入说明》</button>
        <span class="muted" id="reg-read-stat">尚未阅读</span>
      </div>
    </div>
    <div class="field">
      <span>签名（请用鼠标或触屏手写签名）</span>
      <div class="sign-wrap" id="reg-sign-wrap">
        <canvas id="reg-sign" width="600" height="140"></canvas>
        <span class="sign-hint" id="reg-sign-hint">在此签名</span>
      </div>
      <div class="row" style="gap:10px;align-items:center;margin-top:6px">
        <button type="button" class="btn btn-outline btn-sm" id="reg-sign-clear">重签</button>
        <span class="muted" id="reg-sign-stat">尚未签名</span>
      </div>
    </div>
    <button class="btn" type="submit">注 册</button>
    <div class="auth-hint">注册即表示同意本站收集并使用你的班级、姓名、学号，仅对同组织成员与管理员可见（<a href="/#/privacy" target="_blank">隐私说明</a>）</div>
  </form>

  <form id="force-form" hidden>
    <div class="auth-hint" style="margin:0 0 14px">为了安全，请先修改初始密码</div>
    <label class="field"><span>新密码（至少 8 位）</span>
      <div class="pw-wrap"><input class="input" name="new_password" type="password" autocomplete="new-password" required><button type="button" class="pw-toggle" data-target="new_password">显示</button></div>
    </label>
    <label class="field"><span>确认新密码</span><input class="input" name="confirm" type="password" autocomplete="new-password" required></label>
    <button class="btn" type="submit">修改并进入</button>
  </form>
</div>
<script src="/theme.js" defer></script>
<script src="/disclaimer.js" defer></script>
<script src="/auth.js" defer></script>
</body>
</html>
